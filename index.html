<style>
:root {
  --bg: #f7f8fa; --card: #ffffff; --text: #1b1f24; --muted: #57606a; --border: #d0d7de;
  --accent: #0b5cad; --bar: #3b82c4; --bar-track: #e6ebf1; --sel: #e3effb;
  --sans: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161b; --card: #1a2027; --text: #e6e9ed; --muted: #a2adba; --border: #333c47;
    --accent: #7db7ee; --bar: #4f8fd0; --bar-track: #2a323c; --sel: #22364d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); }
main { max-width: 64rem; margin: 0 auto; padding: 1rem; }
h1 { font-size: 1.4rem; margin: 0.5rem 0 0.25rem; }
h2 { font-size: 1.1rem; margin: 0 0 0.75rem; }
.sub { color: var(--muted); margin: 0 0 1rem; }
section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 0 0 1rem; }
.num, .count { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.5rem; margin: 0; }
.stats div { border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.75rem; }
.stats dt { color: var(--muted); font-size: 0.85rem; }
.stats dd { margin: 0; font-size: 1.4rem; }
.bars { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 0.5rem; align-items: center; padding: 0.2rem 0; }
.row .name { grid-column: 1 / -1; overflow-wrap: anywhere; }
.track { height: 0.9rem; background: var(--bar-track); border-radius: 3px; overflow: hidden; }
.bar { height: 100%; background: var(--bar); }
.count { text-align: right; min-width: 3ch; }
@media (min-width: 40rem) {
  .row { grid-template-columns: 16rem minmax(0, 1fr) 3.5ch; }
  .row .name { grid-column: auto; }
}
button.name, button.chip {
  font: inherit; color: var(--accent); background: none; border: 0; padding: 0.15rem 0;
  text-align: left; cursor: pointer; text-decoration: underline; overflow-wrap: anywhere;
}
button.chip { border: 1px solid var(--border); border-radius: 1rem; padding: 0.2rem 0.7rem; text-decoration: none; background: var(--card); }
button[aria-pressed="true"] { background: var(--sel); font-weight: 600; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 1rem; padding: 0; list-style: none; }
.chip .count { color: var(--muted); font-size: 0.85rem; margin-left: 0.3rem; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
td.date { white-space: nowrap; font-family: var(--mono); font-variant-numeric: tabular-nums; }
td a { color: var(--accent); overflow-wrap: anywhere; }
td.prod { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
@media (max-width: 40rem) {
  thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { border-bottom: 1px solid var(--border); padding: 0.5rem 0; }
  td { border: 0; padding: 0.1rem 0; }
  td.prod::before { content: "サービス: "; }
}
.note { color: var(--muted); font-size: 0.9rem; }
footer { color: var(--muted); font-size: 0.85rem; padding: 0.5rem 0 1.5rem; }
@media (prefers-reduced-motion: no-preference) {
  button { transition: background-color 0.15s; }
}
</style>
</head>

s-fargate":1,"aws-glue":1,"aws-identity-and-access-management":1,"aws-lake-formation":1,"aws-lambda":1,"aws-local-zones":1,"aws-management-console":1,"aws-security-hub":3,"aws-systems-manager":1,"aws-waf":1,"aws-x-ray":1},"start":"2026-11-02","total_items":60,"unclassified_items":19,"unmeasured_days":5,"week":"2026-W45"},"window_days":365}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var week = data.week;
  var NONE_KEY = "_none";
  var NONE_LABEL = "分類なし";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function labelOf(key) { return key === NONE_KEY ? NONE_LABEL : key; }
  function isSafeUrl(u) { return /^https?:\/\//i.test(u); }

  // 記事を分類ごとに振り分ける。複数の分類に入る記事はそれぞれに入れ、空なら「分類なし」。
  var byCat = Object.create(null);
  data.items.forEach(function (it) {
    var cats = it.c.length ? it.c : [NONE_KEY];
    cats.forEach(function (c) { (byCat[c] = byCat[c] || []).push(it); });
  });

  document.getElementById("win-days").textContent = String(data.window_days);
  document.getElementById("win-days-2").textContent = String(data.window_days);
  document.getElementById("week-line").textContent =
    week.week + "(" + week.start + " 〜 " + week.end + ")";

  // 統計
  var stats = [
    ["全 item 数", week.total_items],
    ["分類なし", week.unclassified_items],
    ["GovCloud 向け", week.govcloud_items],
    ["欠落日", week.missing_days],
    ["未計測日", week.unmeasured_days]
  ];
  var dl = document.getElementById("stats");
  stats.forEach(function (s) {
    var box = el("div");
    box.appendChild(el("dt", "", s[0]));
    box.appendChild(el("dd", "num", String(s[1])));
    dl.appendChild(box);
  });
  document.getElementById("week-note").textContent =
    "欠落日は取得できなかった平日、未計測日は取得を始める前の平日です。週の途中は、その時点までの値です。";

  // 横棒グラフ
  function drawBars(listId, entries, onPick) {
    var ul = document.getElementById(listId);
    var max = entries.reduce(function (m, e) { return Math.max(m, e[1]); }, 1);
    entries.forEach(function (e) {
      var li = el("li", "row");
      if (onPick) {
        var b = el("button", "name", labelOf(e[0]));
        b.type = "button";
        b.addEventListener("click", function () { select(e[0], true); });
        li.appendChild(b);
      } else {
        li.appendChild(el("span", "name", e[0]));
      }
      var track = el("div", "track");
      var bar = el("div", "bar");
      bar.style.width = (100 * e[1] / max).toFixed(1) + "%";
      track.appendChild(bar);
      li.appendChild(track);
      li.appendChild(el("span", "count", String(e[1])));
      ul.appendChild(li);
    });
  }
  function sortedEntries(obj) {
    return Object.keys(obj).map(function (k) { return [k, obj[k]]; })
      .sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
  }
  var catEntries = sortedEntries(week.marchitecture);
  if (week.unclassified_items > 0) {
    // 分類なしは、アルファベット順の並びの最後に置く
    catEntries.push([NONE_KEY, week.unclassified_items]);
  }
  drawBars("cat-bars", catEntries, true);
  drawBars("prod-bars", sortedEntries(week.products).filter(function (e) { return e[1] >= 2; }), false);

  // 分類ボタン(直近 365 日の件数)
  var chips = document.getElementById("chips");
  var chipButtons = Object.create(null);
  Object.keys(byCat)
    // アルファベット順。分類なしは最後
    .sort(function (a, b) {
      if (a === NONE_KEY) { return b === NONE_KEY ? 0 : 1; }
      if (b === NONE_KEY) { return -1; }
      return a < b ? -1 : a > b ? 1 : 0;
    })
    .forEach(function (key) {
      var li = el("li");
      var b = el("button", "chip", labelOf(key));
      b.type = "button";
      b.appendChild(el("span", "count", String(byCat[key].length)));
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { select(key, false); });
      li.appendChild(b);
      chips.appendChild(li);
      chipButtons[key] = b;
    });

  // 記事の表
  var table = document.getElementById("items-table");
  var tbody = document.getElementById("items-body");
  var caption = document.getElementById("items-caption");
  function showCategory(key) {
    Object.keys(chipButtons).forEach(function (k) {
      chipButtons[k].setAttribute("aria-pressed", k === key ? "true" : "false");
    });
    while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
    if (!key) {
      table.hidden = true;
      caption.textContent = "分類を選ぶと、その分類の記事を新しい順に表示します。";
      return;
    }
    var rows = byCat[key] || [];
    caption.textContent = labelOf(key) + ": " + rows.length + " 件(直近 " + data.window_days + " 日、新しい順)";
    table.hidden = rows.length === 0;
    var frag = document.createDocumentFragment();
    rows.forEach(function (it) {
      var tr = el("tr");
      tr.appendChild(el("td", "date", it.d));
      var td = el("td");
      if (isSafeUrl(it.l)) {
        var a = el("a", "", it.t);
        a.href = it.l;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        td.appendChild(a);
      } else {
        td.textContent = it.t;
      }
      tr.appendChild(td);
      tr.appendChild(el("td", "prod", it.p.join(", ")));
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }

  function keyFromHash() {
    var m = /^#cat=(.*)$/.exec(location.hash);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return null; }
  }
  function select(key, scroll) {
    location.hash = "cat=" + encodeURIComponent(key);
    if (scroll) document.getElementById("items-section").scrollIntoView();
  }
  window.addEventListener("hashchange", function () { showCategory(keyFromHash()); });
  showCategory(keyFromHash());
})();
</script>
